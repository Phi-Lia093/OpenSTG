# Sprite rectangles in texture pixels, as the original stores them.
version = 2
texture = "texture.png"
width = 512
height = 256

[[sprite]]
id = 0
rect = [0, 0, 256, 64]

[[sprite]]
id = 1
rect = [0, 64, 256, 64]

[[sprite]]
id = 2
rect = [0, 128, 256, 64]

[[sprite]]
id = 3
rect = [256, 0, 256, 64]

[[sprite]]
id = 4
rect = [256, 64, 256, 64]

[[sprite]]
id = 5
rect = [256, 128, 256, 64]
